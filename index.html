<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>DoxSub 3D</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #0d1b2a;
            font-family: 'Arial', sans-serif;
            touch-action: none;
        }
        canvas { display: block; }
        #ui {
            position: absolute;
            top: 20px;
            left: 20px;
            color: #fff;
            font-size: 30px;
            font-weight: bold;
            text-shadow: 2px 2px 0 #000, 0 0 10px #00ffcc;
            pointer-events: none;
            z-index: 100;
        }
        #ui span { color: #ffd700; }
        #game-over {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85);
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: white;
            z-index: 10;
        }
        #game-over h1 { font-size: 50px; margin: 0 0 10px 0; color: #ff4444; }
        .btn-restart {
            padding: 15px 40px;
            font-size: 20px;
            background: #00ffcc;
            color: #000;
            border: none;
            border-radius: 30px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 20px;
        }
        .mobile-hint {
            position: absolute;
            bottom: 20px;
            width: 100%;
            text-align: center;
            color: rgba(255,255,255,0.6);
            font-size: 14px;
            pointer-events: none;
            z-index: 100;
        }
        /* Tela de erro caso o 3D falhe */
        #error-screen {
            display: none;
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            background: red;
            color: white;
            padding: 20px;
            font-size: 16px;
            text-align: center;
            z-index: 999;
            width: 80%;
            border-radius: 10px;
        }
    </style>
    <!-- Versão mais nova e estável do Three.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r152/three.min.js"></script>
</head>
<body>

    <div id="ui">SCORE: <span id="score">0</span></div>
    <div id="error-screen"></div>

    <div id="game-over">
        <h1>GAME OVER</h1>
        <p style="font-size: 24px;">Sua pontuação: <span id="final-score" style="color:#ffd700">0</span></p>
        <button class="btn-restart" onclick="restartGame()">JOGAR NOVAMENTE</button>
    </div>

    <div class="mobile-hint">Arraste: ⬅️ ➡️ Desviar | ⬆️ Pular (2x = Burla) | ⬇️ Deslizar</div>

    <script>
        // Captura erros para não ficar tela preta
        window.addEventListener('error', function(e) {
            document.getElementById('error-screen').style.display = 'block';
            document.getElementById('error-screen').innerText = "Erro no jogo: " + e.message;
        });

        try {
            // --- CONFIGURAÇÃO BÁSICA ---
            const scene = new THREE.Scene();
            scene.background = new THREE.Color(0x0d1b2a);
            scene.fog = new THREE.Fog(0x0d1b2a, 20, 100);

            const camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 6, 10);
            camera.lookAt(0, 2, 0);

            const renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.shadowMap.enabled = true;
            document.body.appendChild(renderer.domElement);

            // --- ILUMINAÇÃO ---
            scene.add(new THREE.AmbientLight(0xffffff, 0.6));
            const dirLight = new THREE.DirectionalLight(0xffffff, 1);
            dirLight.position.set(10, 20, 10);
            dirLight.castShadow = true;
            scene.add(dirLight);

            // --- VARIÁVEIS ---
            let score = 0;
            let speed = 0.5;
            let isGameOver = false;
            let currentLane = 1;
            const laneWidth = 3.5;
            let jumpVelocity = 0;
            let gravity = -0.025;
            let isJumping = false;
            let jumpCount = 0;
            let isSliding = false;
            let slideTimer = 0;
            let obstacles = [];
            let buildings = [];
            let coins = [];

            // --- PERSONAGEM ---
            const playerGroup = new THREE.Group();
            
            // Prancha
            const board = new THREE.Mesh(
                new THREE.BoxGeometry(1.2, 0.1, 2),
                new THREE.MeshStandardMaterial({ color: 0xff00ff })
            );
            board.position.y = 0.1;
            playerGroup.add(board);

            // Corpo (Trocado para cilindro pra funcionar em qualquer celular)
            const torso = new THREE.Mesh(
                new THREE.CylinderGeometry(0.35, 0.35, 1, 16),
                new THREE.MeshStandardMaterial({ color: 0x00ffcc })
            );
            torso.position.y = 0.9;
            playerGroup.add(torso);

            // Cabeça
            const head = new THREE.Mesh(
                new THREE.SphereGeometry(0.35, 16, 16),
                new THREE.MeshStandardMaterial({ color: 0xffccaa })
            );
            head.position.y = 1.6;
            playerGroup.add(head);

            // Boné
            const hat = new THREE.Mesh(
                new THREE.CylinderGeometry(0.36, 0.36, 0.2, 16, 1, false, 0, Math.PI),
                new THREE.MeshStandardMaterial({ color: 0xff3333 })
            );
            hat.position.set(0, 1.8, -0.1);
            hat.rotation.x = Math.PI / 2;
            playerGroup.add(hat);

            // Pernas
            const legGeo = new THREE.CylinderGeometry(0.15, 0.15, 0.8, 8);
            const legMat = new THREE.MeshStandardMaterial({ color: 0x3333ff });
            
            const leftLeg = new THREE.Mesh(legGeo, legMat);
            leftLeg.position.set(-0.2, 0.3, 0);
            playerGroup.add(leftLeg);
            
            const rightLeg = new THREE.Mesh(legGeo, legMat);
            rightLeg.position.set(0.2, 0.3, 0);
            playerGroup.add(rightLeg);

            scene.add(playerGroup);

            // --- CENÁRIO ---
            const floor = new THREE.Mesh(
                new THREE.PlaneGeometry(30, 300),
                new THREE.MeshStandardMaterial({ color: 0x222222 })
            );
            floor.rotation.x = -Math.PI / 2;
            floor.position.z = -100;
            floor.receiveShadow = true;
            scene.add(floor);

            // Trilhos
            const railMat = new THREE.MeshStandardMaterial({ color: 0x888888 });
            for (let i = 0; i < 3; i++) {
                for (let j = -0.4; j <= 0.4; j += 0.8) {
                    const rail = new THREE.Mesh(new THREE.BoxGeometry(0.1, 0.1, 300), railMat);
                    rail.position.set((i - 1) * laneWidth + j, 0.05, -100);
                    scene.add(rail);
                }
            }

            // --- CONTROLES ---
            function moveLeft() {
                if (currentLane > 0 && !isGameOver) {
                    currentLane--;
                    playerGroup.position.x = (currentLane - 1) * laneWidth; // Instantâneo
                }
            }

            function moveRight() {
                if (currentLane < 2 && !isGameOver) {
                    currentLane++;
                    playerGroup.position.x = (currentLane - 1) * laneWidth; // Instantâneo
                }
            }

            function jump() {
                if (isGameOver) return;
                if (!isJumping || jumpCount < 2) {
                    isJumping = true;
                    jumpCount++;
                    jumpVelocity = jumpCount === 1 ? 0.45 : 0.6; // Burla no 2º pulo
                }
            }

            function slide() {
                if (!isSliding && !isGameOver) {
                    isSliding = true;
                    slideTimer = 60;
                    torso.scale.y = 0.5;
                    head.position.y = 1.1;
                    hat.position.y = 1.3;
                    leftLeg.position.y = 0.15;
                    rightLeg.position.y = 0.15;
                }
            }

            window.addEventListener('keydown', (e) => {
                if (e.key === 'ArrowLeft' || e.key === 'a') moveLeft();
                if (e.key === 'ArrowRight' || e.key === 'd') moveRight();
                if (e.key === 'ArrowUp' || e.key === 'w' || e.key === ' ') jump();
                if (e.key === 'ArrowDown' || e.key === 's') slide();
            });

            let touchStartX = 0, touchStartY = 0;
            window.addEventListener('touchstart', (e) => {
                touchStartX = e.changedTouches[0].screenX;
                touchStartY = e.changedTouches[0].screenY;
            }, {passive: true});

            window.addEventListener('touchend', (e) => {
                let diffX = e.changedTouches[0].screenX - touchStartX;
                let diffY = e.changedTouches[0].screenY - touchStartY;
                if (Math.abs(diffX) > 30 || Math.abs(diffY) > 30) {
                    if (Math.abs(diffX) > Math.abs(diffY)) {
                        if (diffX > 0) moveRight(); else moveLeft();
                    } else {
                        if (diffY > 0) slide(); else jump();
                    }
                }
            }, {passive: true});

            // --- OBSTÁCULOS ---
            function spawnTrain() {
                if (isGameOver) return;
                const lane = Math.floor(Math.random() * 3);
                const train = new THREE.Mesh(
                    new THREE.BoxGeometry(2.2, 3.5, 15),
                    new THREE.MeshStandardMaterial({ color: 0xcc0000 })
                );
                train.position.set((lane - 1) * laneWidth, 1.75, -120);
                scene.add(train);
                obstacles.push({ mesh: train, type: 'train' });
            }

            function spawnCone() {
                if (isGameOver) return;
                const lane = Math.floor(Math.random() * 3);
                const cone = new THREE.Mesh(
                    new THREE.ConeGeometry(0.5, 1.2, 16),
                    new THREE.MeshStandardMaterial({ color: 0xff6600 })
                );
                cone.position.set((lane - 1) * laneWidth, 0.6, -120);
                scene.add(cone);
                obstacles.push({ mesh: cone, type: 'cone' });
            }

            function spawnCoin() {
                if (isGameOver) return;
                const lane = Math.floor(Math.random() * 3);
                const coin = new THREE.Mesh(
                    new THREE.CylinderGeometry(0.4, 0.4, 0.1, 16),
                    new THREE.MeshStandardMaterial({ color: 0xffd700 })
                );
                coin.rotation.x = Math.PI / 2;
                coin.position.set((lane - 1) * laneWidth, 1.2, -120);
                scene.add(coin);
                coins.push(coin);
            }

            function spawnBuilding() {
                const side = Math.random() > 0.5 ? -12 : 12;
                const height = Math.random() * 20 + 10;
                const b = new THREE.Mesh(
                    new THREE.BoxGeometry(8, height, 20),
                    new THREE.MeshStandardMaterial({ color: 0x333333 })
                );
                b.position.set(side, height/2, -120);
                scene.add(b);
                buildings.push(b);
            }

            // --- LOOP PRINCIPAL ---
            let frameCount = 0;
            function animate() {
                requestAnimationFrame(animate);

                if (!isGameOver) {
                    frameCount++;
                    score += 1;
                    document.getElementById('score').innerText = Math.floor(score / 10);
                    
                    if (score % 500 === 0) speed += 0.05;

                    if (isJumping) {
                        playerGroup.position.y += jumpVelocity;
                        jumpVelocity += gravity;
                        if (playerGroup.position.y <= 0) {
                            playerGroup.position.y = 0;
                            isJumping = false;
                            jumpCount = 0;
                        }
                    }

                    if (!isJumping && !isSliding) {
                        leftLeg.rotation.x = Math.sin(frameCount * 0.4) * 0.5;
                        rightLeg.rotation.x = Math.sin(frameCount * 0.4 + Math.PI) * 0.5;
                    } else {
                        leftLeg.rotation.x = 0.5;
                        rightLeg.rotation.x = -0.5;
                    }

                    if (isSliding) {
                        slideTimer--;
                        if (slideTimer <= 0) {
                            isSliding = false;
                            torso.scale.y = 1;
                            head.position.y = 1.6;
                            hat.position.y = 1.8;
                            leftLeg.position.y = 0.3;
                            rightLeg.position.y = 0.3;
                        }
                    }

                    for (let i = obstacles.length - 1; i >= 0; i--) {
                        let obs = obstacles[i];
                        obs.mesh.position.z += speed;
                        
                        if (Math.abs(obs.mesh.position.x - playerGroup.position.x) < 1.5 && 
                            Math.abs(obs.mesh.position.z - playerGroup.position.z) < (obs.type === 'train' ? 7 : 1)) {
                            
                            if (obs.type === 'train' && playerGroup.position.y < 3.5) gameOver();
                            if (obs.type === 'cone' && playerGroup.position.y < 1.2 && !isSliding) gameOver();
                            if (obs.type === 'train' && isSliding) gameOver();
                        }

                        if (obs.mesh.position.z > 10) {
                            scene.remove(obs.mesh);
                            obstacles.splice(i, 1);
                        }
                    }

                    for (let i = coins.length - 1; i >= 0; i--) {
                        let coin = coins[i];
                        coin.position.z += speed;
                        coin.rotation.z += 0.1;

                        if (Math.abs(coin.position.x - playerGroup.position.x) < 1 && 
                            Math.abs(coin.position.z - playerGroup.position.z) < 1) {
                            scene.remove(coin);
                            coins.splice(i, 1);
                            score += 50;
                        }
                        if (coin.position.z > 10) {
                            scene.remove(coin);
                            coins.splice(i, 1);
                        }
                    }

                    for (let i = buildings.length - 1; i >= 0; i--) {
                        let b = buildings[i];
                        b.position.z += speed;
                        if (b.position.z > 20) {
                            scene.remove(b);
                            buildings.splice(i, 1);
                        }
                    }

                    if (frameCount % 120 === 0) spawnTrain();
                    if (frameCount % 80 === 0) spawnCone();
                    if (frameCount % 60 === 0) spawnCoin();
                    if (frameCount % 90 === 0) spawnBuilding();
                }

                renderer.render(scene, camera);
            }

            function gameOver() {
                isGameOver = true;
                document.getElementById('final-score').innerText = Math.floor(score / 10);
                document.getElementById('game-over').style.display = 'flex';
            }

            function restartGame() {
                isGameOver = false;
                score = 0;
                speed = 0.5;
                currentLane = 1;
                isJumping = false;
                jumpCount = 0;
                playerGroup.position.set(0, 0, 0);
                torso.scale.y = 1;
                head.position.y = 1.6;
                hat.position.y = 1.8;
                leftLeg.position.y = 0.3;
                rightLeg.position.y = 0.3;
                isSliding = false;

                obstacles.forEach(obs => scene.remove(obs.mesh));
                coins.forEach(coin => scene.remove(coin));
                buildings.forEach(b => scene.remove(b));
                obstacles = []; coins = []; buildings = [];

                document.getElementById('game-over').style.display = 'none';
                document.getElementById('score').innerText = "0";
            }

            window.addEventListener('resize', () => {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            });

            animate();

        } catch (error) {
            document.getElementById('error-screen').style.display = 'block';
            document.getElementById('error-screen').innerText = "Erro crítico: " + error.message;
        }
    </script>
</body>
</html>
