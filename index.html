<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Subway Surfers 3D - Realistic Edition</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #1a1a1a;
            font-family: 'Arial', sans-serif;
            touch-action: none; /* Impede rolagem */
        }
        canvas { display: block; }
        #ui {
            position: absolute;
            top: 20px;
            left: 20px;
            color: #fff;
            font-size: 30px;
            font-weight: bold;
            text-shadow: 2px 2px 0 #000, 0 0 10px #00ffcc;
            pointer-events: none;
        }
        #ui span { color: #ffd700; }
        #game-over {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85);
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: white;
            z-index: 10;
            backdrop-filter: blur(5px);
        }
        #game-over h1 { font-size: 50px; margin: 0 0 10px 0; color: #ff4444; text-shadow: 0 0 20px #ff0000; }
        .btn-restart {
            padding: 15px 40px;
            font-size: 20px;
            background: #00ffcc;
            color: #000;
            border: none;
            border-radius: 30px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 20px;
            box-shadow: 0 0 15px #00ffcc;
        }
        /* Controles Mobile (Toque) */
        .mobile-hint {
            position: absolute;
            bottom: 20px;
            width: 100%;
            text-align: center;
            color: rgba(255,255,255,0.5);
            font-size: 14px;
            pointer-events: none;
        }
    </style>
    <!-- Three.js Engine -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <div id="ui">SCORE: <span id="score">0</span></div>

    <div id="game-over">
        <h1>GAME OVER</h1>
        <p style="font-size: 24px; color:#fff;">Sua pontuação: <span id="final-score" style="color:#ffd700">0</span></p>
        <button class="btn-restart" onclick="restartGame()">JOGAR NOVAMENTE</button>
    </div>

    <div class="mobile-hint">Arraste para os lados, cima (Pular) e baixo (Deslizar)</div>

    <script>
        // --- CONFIGURAÇÃO BÁSICA ---
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x0d1b2a); // Céu noturno/crepúsculo
        scene.fog = new THREE.Fog(0x0d1b2a, 20, 100);

        const camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 6, 10);
        camera.lookAt(0, 2, 0);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true; // Ativa sombras realistas
        document.body.appendChild(renderer.domElement);

        // Iluminação
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
        scene.add(ambientLight);
        
        const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
        dirLight.position.set(10, 20, 10);
        dirLight.castShadow = true;
        scene.add(dirLight);

        // --- VARIÁVEIS DO JOGO ---
        let score = 0;
        let speed = 0.5;
        let isGameOver = false;
        let currentLane = 1; // 0 = Esq, 1 = Centro, 2 = Dir
        const laneWidth = 3.5;
        
        let jumpVelocity = 0;
        let gravity = -0.025;
        let isJumping = false;
        let jumpCount = 0; // Para a "Burla" (Double Jump)
        
        let isSliding = false;
        let slideTimer = 0;

        let obstacles = [];
        let buildings = [];
        let coins = [];

        // --- CRIANDO O PERSONAGEM (ESTILO BONECO 3D) ---
        const playerGroup = new THREE.Group();
        
        // Prancha (Hoverboard)
        const boardGeo = new THREE.BoxGeometry(1.2, 0.1, 2);
        const boardMat = new THREE.MeshStandardMaterial({ color: 0xff00ff, emissive: 0x550055 });
        const board = new THREE.Mesh(boardGeo, boardMat);
        board.position.y = 0.1;
        board.castShadow = true;
        playerGroup.add(board);

        // Corpo
        const torsoGeo = new THREE.CapsuleGeometry(0.4, 0.8, 4, 8);
        const torsoMat = new THREE.MeshStandardMaterial({ color: 0x00ffcc });
        const torso = new THREE.Mesh(torsoGeo, torsoMat);
        torso.position.y = 0.9;
        torso.castShadow = true;
        playerGroup.add(torso);

        // Cabeça
        const headGeo = new THREE.SphereGeometry(0.35, 16, 16);
        const headMat = new THREE.MeshStandardMaterial({ color: 0xffccaa });
        const head = new THREE.Mesh(headGeo, headMat);
        head.position.y = 1.7;
        head.castShadow = true;
        playerGroup.add(head);

        // Boné
        const hatGeo = new THREE.CylinderGeometry(0.36, 0.36, 0.2, 16, 1, false, 0, Math.PI);
        const hatMat = new THREE.MeshStandardMaterial({ color: 0xff3333 });
        const hat = new THREE.Mesh(hatGeo, hatMat);
        hat.position.set(0, 1.85, -0.1);
        hat.rotation.x = Math.PI / 2;
        playerGroup.add(hat);

        // Pernas (Animadas)
        const legGeo = new THREE.CylinderGeometry(0.15, 0.15, 0.8, 8);
        const legMat = new THREE.MeshStandardMaterial({ color: 0x3333ff });
        const leftLeg = new THREE.Mesh(legGeo, legMat);
        leftLeg.position.set(-0.2, 0.3, 0);
        leftLeg.castShadow = true;
        playerGroup.add(leftLeg);
        
        const rightLeg = new THREE.Mesh(legGeo, legMat);
        rightLeg.position.set(0.2, 0.3, 0);
        rightLeg.castShadow = true;
        playerGroup.add(rightLeg);

        scene.add(playerGroup);

        // --- CENÁRIO (TRILHOS E CHÃO) ---
        const floorGeo = new THREE.PlaneGeometry(30, 300);
        const floorMat = new THREE.MeshStandardMaterial({ color: 0x222222, roughness: 0.8 });
        const floor = new THREE.Mesh(floorGeo, floorMat);
        floor.rotation.x = -Math.PI / 2;
        floor.position.z = -100;
        floor.receiveShadow = true;
        scene.add(floor);

        // Trilhos de Metal
        const railMat = new THREE.MeshStandardMaterial({ color: 0x888888, metalness: 0.8, roughness: 0.2 });
        for (let i = 0; i < 3; i++) {
            for (let j = -0.4; j <= 0.4; j += 0.8) {
                const railGeo = new THREE.BoxGeometry(0.1, 0.1, 300);
                const rail = new THREE.Mesh(railGeo, railMat);
                rail.position.set((i - 1) * laneWidth + j, 0.05, -100);
                scene.add(rail);
            }
        }

        // --- FUNÇÕES DE CONTROLE (SUPER RESPONSIVAS) ---
        function moveLeft() {
            if (currentLane > 0 && !isGameOver) {
                currentLane--;
                // Resposta instantânea (sem delay)
                playerGroup.position.x = (currentLane - 1) * laneWidth; 
            }
        }

        function moveRight() {
            if (currentLane < 2 && !isGameOver) {
                currentLane++;
                playerGroup.position.x = (currentLane - 1) * laneWidth;
            }
        }

        function jump() {
            if (isGameOver) return;
            
            // Sistema de Double Jump (Burla)
            if (!isJumping || jumpCount < 2) {
                isJumping = true;
                jumpCount++;
                jumpVelocity = jumpCount === 1 ? 0.45 : 0.6; // Segundo pulo é mais forte
                
                // Efeito visual de giro no pulo duplo
                if (jumpCount === 2) {
                    playerGroup.rotation.x = 0; 
                }
            }
        }

        function slide() {
            if (!isSliding && !isGameOver) {
                isSliding = true;
                slideTimer = 60; // Dura 1 segundo (60 frames)
                // Abaixa o personagem
                torso.scale.y = 0.5;
                head.position.y = 1.2;
                hat.position.y = 1.35;
                leftLeg.position.y = 0.15;
                rightLeg.position.y = 0.15;
            }
        }

        // --- CONTROLES DE TECLADO ---
        window.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowLeft' || e.key === 'a') moveLeft();
            if (e.key === 'ArrowRight' || e.key === 'd') moveRight();
            if (e.key === 'ArrowUp' || e.key === 'w' || e.key === ' ') jump();
            if (e.key === 'ArrowDown' || e.key === 's') slide();
        });

        // --- CONTROLES DE SWIPE (MOBILE) ---
        let touchStartX = 0;
        let touchStartY = 0;
        window.addEventListener('touchstart', (e) => {
            touchStartX = e.changedTouches[0].screenX;
            touchStartY = e.changedTouches[0].screenY;
        }, {passive: true});

        window.addEventListener('touchend', (e) => {
            let touchEndX = e.changedTouches[0].screenX;
            let touchEndY = e.changedTouches[0].screenY;
            let diffX = touchEndX - touchStartX;
            let diffY = touchEndY - touchStartY;
            
            // Sensibilidade do Swipe (menor = mais fácil)
            if (Math.abs(diffX) > 30 || Math.abs(diffY) > 30) {
                if (Math.abs(diffX) > Math.abs(diffY)) {
                    if (diffX > 0) moveRight(); else moveLeft();
                } else {
                    if (diffY > 0) slide(); else jump();
                }
            }
        }, {passive: true});

        // --- GERADORES DE OBSTÁCULOS E CENÁRIO ---
        function spawnTrain() {
            if (isGameOver) return;
            const lane = Math.floor(Math.random() * 3);
            
            // Trem (Não é quadrado, tem teto arredondado)
            const trainGroup = new THREE.Group();
            
            const bodyGeo = new THREE.BoxGeometry(2.2, 3.5, 15); // Trem longo
            const bodyMat = new THREE.MeshStandardMaterial({ color: 0xcc0000, roughness: 0.4 });
            const body = new THREE.Mesh(bodyGeo, bodyMat);
            body.position.y = 1.75;
            body.castShadow = true;
            body.receiveShadow = true;
            trainGroup.add(body);

            // Detalhes do trem (Janelas)
            const windowGeo = new THREE.BoxGeometry(2.25, 0.8, 2);
            const windowMat = new THREE.MeshStandardMaterial({ color: 0x000000, emissive: 0x333333 });
            for (let i = -4; i <= 4; i+=2) {
                const win = new THREE.Mesh(windowGeo, windowMat);
                win.position.set(0, 2.5, i);
                trainGroup.add(win);
            }

            trainGroup.position.set((lane - 1) * laneWidth, 0, -120);
            scene.add(trainGroup);
            obstacles.push({ mesh: trainGroup, type: 'train' });
        }

        function spawnCone() {
            if (isGameOver) return;
            const lane = Math.floor(Math.random() * 3);
            
            // Cone de Trânsito (Obstáculo baixo)
            const coneGeo = new THREE.ConeGeometry(0.5, 1.2, 16);
            const coneMat = new THREE.MeshStandardMaterial({ color: 0xff6600 });
            const cone = new THREE.Mesh(coneGeo, coneMat);
            cone.position.set((lane - 1) * laneWidth, 0.6, -120);
            cone.castShadow = true;
            scene.add(cone);
            obstacles.push({ mesh: cone, type: 'cone' });
        }

        function spawnCoin() {
            if (isGameOver) return;
            const lane = Math.floor(Math.random() * 3);
            const coinGeo = new THREE.CylinderGeometry(0.4, 0.4, 0.1, 16);
            const coinMat = new THREE.MeshStandardMaterial({ color: 0xffd700, metalness: 1, roughness: 0.1 });
            const coin = new THREE.Mesh(coinGeo, coinMat);
            coin.rotation.x = Math.PI / 2;
            coin.position.set((lane - 1) * laneWidth, 1.2, -120);
            scene.add(coin);
            coins.push(coin);
        }

        // Criar Prédios no cenário
        function spawnBuilding() {
            const isLeft = Math.random() > 0.5;
            const side = isLeft ? -12 : 12;
            const height = Math.random() * 20 + 10;
            const bGeo = new THREE.BoxGeometry(8, height, 20);
            const bMat = new THREE.MeshStandardMaterial({ color: Math.random() * 0x555555 + 0x222222 });
            const b = new THREE.Mesh(bGeo, bMat);
            b.position.set(side, height/2, -120);
            scene.add(b);
            buildings.push(b);
        }

        // --- LOOP PRINCIPAL ---
        let frameCount = 0;
        function animate() {
            requestAnimationFrame(animate);

            if (!isGameOver) {
                frameCount++;
                score += 1;
                document.getElementById('score').innerText = Math.floor(score / 10);
                
                if (score % 500 === 0) speed += 0.05;

                // Física de Pulo
                if (isJumping) {
                    playerGroup.position.y += jumpVelocity;
                    jumpVelocity += gravity;
                    if (playerGroup.position.y <= 0) {
                        playerGroup.position.y = 0;
                        isJumping = false;
                        jumpCount = 0;
                    }
                }

                // Animação de correr
                if (!isJumping && !isSliding) {
                    leftLeg.rotation.x = Math.sin(frameCount * 0.4) * 0.5;
                    rightLeg.rotation.x = Math.sin(frameCount * 0.4 + Math.PI) * 0.5;
                } else {
                    leftLeg.rotation.x = 0.5;
                    rightLeg.rotation.x = -0.5;
                }

                // Controle do Deslize
                if (isSliding) {
                    slideTimer--;
                    if (slideTimer <= 0) {
                        isSliding = false;
                        torso.scale.y = 1;
                        head.position.y = 1.7;
                        hat.position.y = 1.85;
                        leftLeg.position.y = 0.3;
                        rightLeg.position.y = 0.3;
                    }
                }

                // Lógica de movimentação de objetos (Loop infinito)
                for (let i = obstacles.length - 1; i >= 0; i--) {
                    let obs = obstacles[i];
                    obs.mesh.position.z += speed;
                    
                    // Colisão
                    if (Math.abs(obs.mesh.position.x - playerGroup.position.x) < 1.5 && 
                        Math.abs(obs.mesh.position.z - playerGroup.position.z) < (obs.type === 'train' ? 7 : 1)) {
                        
                        // Se for trem, precisa pular ou desviar
                        if (obs.type === 'train' && playerGroup.position.y < 3.5 && !isSliding) gameOver();
                        // Se for cone, pode deslizar ou pular
                        if (obs.type === 'cone' && playerGroup.position.y < 1.2 && !isSliding) gameOver();
                        // Se deslizar, morre no trem (porque ele é alto), mas passa no cone
                        if (obs.type === 'train' && isSliding) gameOver();
                    }

                    if (obs.mesh.position.z > 10) {
                        scene.remove(obs.mesh);
                        obstacles.splice(i, 1);
                    }
                }

                for (let i = coins.length - 1; i >= 0; i--) {
                    let coin = coins[i];
                    coin.position.z += speed;
                    coin.rotation.z += 0.1;

                    if (Math.abs(coin.position.x - playerGroup.position.x) < 1 && 
                        Math.abs(coin.position.z - playerGroup.position.z) < 1) {
                        scene.remove(coin);
                        coins.splice(i, 1);
                        score += 50;
                    }
                    if (coin.position.z > 10) {
                        scene.remove(coin);
                        coins.splice(i, 1);
                    }
                }

                for (let i = buildings.length - 1; i >= 0; i--) {
                    let b = buildings[i];
                    b.position.z += speed;
                    if (b.position.z > 20) {
                        scene.remove(b);
                        buildings.splice(i, 1);
                    }
                }

                // Spawners
                if (frameCount % 120 === 0) spawnTrain();
                if (frameCount % 80 === 0) spawnCone();
                if (frameCount % 60 === 0) spawnCoin();
                if (frameCount % 90 === 0) spawnBuilding();
            }

            renderer.render(scene, camera);
        }

        function gameOver() {
            isGameOver = true;
            document.getElementById('final-score').innerText = Math.floor(score / 10);
            document.getElementById('game-over').style.display = 'flex';
        }

        function restartGame() {
            isGameOver = false;
            score = 0;
            speed = 0.5;
            currentLane = 1;
            isJumping = false;
            jumpCount = 0;
            playerGroup.position.set(0, 0, 0);
            playerGroup.rotation.x = 0;
            
            // Reseta o corpo
            torso.scale.y = 1;
            head.position.y = 1.7;
            hat.position.y = 1.85;
            leftLeg.position.y = 0.3;
            rightLeg.position.y = 0.3;
            isSliding = false;

            obstacles.forEach(obs => scene.remove(obs.mesh));
            coins.forEach(coin => scene.remove(coin));
            buildings.forEach(b => scene.remove(b));
            obstacles = []; coins = []; buildings = [];

            document.getElementById('game-over').style.display = 'none';
            document.getElementById('score').innerText = "0";
        }

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        animate();
    </script>
</body>
</html>
